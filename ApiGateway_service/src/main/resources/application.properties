# Application
spring.application.name=ApiGateway_service
server.port=5000

# Database Configuration (H2 pour le développement)
spring.datasource.url=jdbc:h2:mem:gatewaydb
spring.datasource.driverClassName=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

# JPA/Hibernate
spring.jpa.database-platform=org.hibernate.dialect.H2Dialect
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

# H2 Console
spring.h2.console.enabled=true
spring.h2.console.path=/h2-console

# JWT Configuration
jwt.secret=mySecretKeyForJWTTokenGenerationAndValidation123456789
jwt.expiration=86400000

# Services URLs
services.user.url=http://localhost:8081
services.product.url=http://localhost:8082
services.order.url=http://localhost:8083

# Logging
logging.level.com.example.ApiGateway._service=DEBUG
logging.level.org.springframework.security=DEBUG

# Actuator (pour le health check)
management.endpoints.web.exposure.include=health,info
management.endpoint.health.show-details=always