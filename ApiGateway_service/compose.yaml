services:
  postgres:
    image: 'postgres:latest'
    environment:
      - 'POSTGRES_DB=mydatabase'
      - 'POSTGRES_PASSWORD=secret'
      - 'POSTGRES_USER=myuser'
    ports:
      - '5432'

FROM eclipse-temurin:21-jdk-alpine :
WORKDIR /app:
COPY target/*.jar app.jar:
EXPOSE 5000:
ENTRYPOINT ["java", "-jar", "app.jar"]: